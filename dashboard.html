<!DOCTYPE html>
<html lang="en">
<head>

    <title>TARA Identity - Gateway</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #050A18; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; margin: 0; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #FFD700; padding-bottom: 20px; margin-bottom: 30px; }
        h1, h2 { color: #FFD700; margin: 0; }
        button { padding: 10px 20px; background: transparent; color: #FFD700; border: 1px solid #FFD700; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #FFD700; color: #050A18; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 215, 0, 0.3); padding: 20px; border-radius: 8px; text-align: center; transition: 0.3s; }
        .card:hover { border-color: #FFD700; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2); }
        .card a { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #FFD700; color: #050A18; text-decoration: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>

    </header>

        TARA.requireLogin();
    </script>
</body>
</html>
