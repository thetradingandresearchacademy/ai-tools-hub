<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARA Identity - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #050A18; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 8px; border: 1px solid #FFD700; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2); }
        h2 { color: #FFD700; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #050A18; border: 1px solid #FFD700; color: #FFD700; border-radius: 4px; box-sizing: border-box; }
        input::placeholder { color: rgba(255, 215, 0, 0.5); }
        button { width: 100%; padding: 12px; background: #FFD700; color: #050A18; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
        button:hover { background: #e6c200; }
        .links { display: flex; justify-content: space-between; margin-top: 15px; font-size: 0.9em; }
        a { color: #FFD700; text-decoration: none; }
        a:hover { text-decoration: underline; }
        #error-msg { color: #ff4d4d; margin-top: 10px; text-align: center; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>TARA APEX Terminal</h2>
        <form id="login-form">
            <input type="email" id="email" placeholder="Email Address" required autocomplete="email">
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit">Authenticate</button>
        </form>
        <div id="error-msg"></div>
        <div class="links">
            <a href="register.html">Create Account</a>
            <a href="forgot.html">Recover Access</a>
        </div>
    </div>

    <script>
        // CONFIGURATION - UPDATE YOUR KEYS HERE IF NEEDED
        const SUPABASE_URL = "https://lwrqdsqvjfdgrikmjmzi.supabase.co"; // Replace with your new Supabase URL if different
        const SUPABASE_ANON_KEY = "YOUR_NEW_SUPABASE_ANON_KEY_HERE"; // Replace with your actual anon key

        let supabaseClient = null;

        function getClient() {
            if (!supabaseClient && window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
            return supabaseClient;
        }

        // Auto-check if user is already logged in
        window.addEventListener('load', async () => {
            const client = getClient();
            if (client) {
                const { data: { session } } = await client.auth.getSession();
                if (session) {
                    window.location.href = "dashboard.html";
                }
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const errorDiv = document.getElementById('error-msg');
            
            const client = getClient();
            if (!client) {
                errorDiv.textContent = "Auth client loading... Please click Authenticate again.";
                return;
            }

            btn.textContent = "Authenticating...";
            btn.disabled = true;
            errorDiv.textContent = "";
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const { data, error } = await client.auth.signInWithPassword({ email, password });
                if (error) throw error;

                // Success - go to dashboard
                window.location.href = "dashboard.html";
            } catch (error) {
                errorDiv.textContent = error.message || "Authentication failed.";
            } finally {
                btn.textContent = "Authenticate";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
