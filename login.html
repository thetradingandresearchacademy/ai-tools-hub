<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARA Identity - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #050A18; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px 0; box-sizing: border-box; }
        .auth-container { background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 8px; border: 1px solid #FFD700; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2); text-align: center; }
        .logo { width: 120px; height: auto; margin-bottom: 15px; border-radius: 6px; filter: drop-shadow(0 2px 8px rgba(255, 215, 0, 0.3)); }
        h2 { color: #FFD700; text-align: center; margin-bottom: 20px; font-size: 1.5rem; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #050A18; border: 1px solid #FFD700; color: #FFD700; border-radius: 4px; box-sizing: border-box; }
        input::placeholder { color: rgba(255, 215, 0, 0.5); }
        button { width: 100%; padding: 12px; background: #FFD700; color: #050A18; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
        button:hover { background: #e6c200; }
        button:disabled { background: #887a24; cursor: not-allowed; }
        .links { display: flex; justify-content: space-between; margin-top: 15px; font-size: 0.9em; }
        a { color: #FFD700; text-decoration: none; }
        a:hover { text-decoration: underline; }
        #error-msg { color: #ff4d4d; margin-top: 10px; text-align: center; font-size: 0.9em; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="auth-container">
        <img src="/TARA-LOGO-PNG.png" alt="TARA Logo" class="logo">
        <h2>TARA APEX Terminal</h2>
        <form id="login-form">
            <input type="email" id="email" placeholder="Email Address" required autocomplete="email">
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit" id="submit-btn">Authenticate</button>
        </form>
        <div id="error-msg"></div>
        <div class="links">
            <a href="register.html">Create Account</a>
            <a href="forgot.html">Recover Access</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const SUPABASE_URL = "https://dlqttnqlnzcprqxuovte.supabase.co"; 
            const SUPABASE_ANON_KEY = "sb_publishable_nBOtx-lTx94ts2IsdSRQiw_1ktIWKcg"; 
            
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const form = document.getElementById('login-form');
            const btn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-msg');

            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = "dashboard.html";
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                btn.textContent = "Authenticating...";
                btn.disabled = true;
                errorDiv.textContent = "";
                
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                try {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    
                    if (error) {
                        if (error.message.includes("Email not confirmed")) {
                            throw new Error("Please verify your email address before logging in. Check your inbox.");
                        }
                        throw error;
                    }

                    window.location.href = "dashboard.html";
                } catch (error) {
                    errorDiv.textContent = error.message || "Authentication failed.";
                } finally {
                    btn.textContent = "Authenticate";
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
